<spinner-util></spinner-util>

<!-- Standalone: layout OAS + respaldo de menú local -->
<ng-container *ngIf="!isMicrofrontend">
    <ng-uui-oas #oasElement [environment]="environment"></ng-uui-oas>

    <div [ngClass]="!loaded? 'container':'main-container'" id="container">
        <div class="app-fallback-menu" *ngIf="!loaded">
            <mat-card class="app-fallback-card">
                <mat-card-header class="app-fallback-card-header">
                    <mat-card-title>
                        <h3 class="app-fallback-title">Gestionar syllabus</h3>
                    </mat-card-title>
                </mat-card-header>
                <mat-card-content class="app-fallback-card-content">
                    <mat-nav-list class="app-fallback-list">
                        <a mat-list-item routerLink="/buscar_syllabus" class="app-fallback-link">
                            Consultar
                        </a>
                    </mat-nav-list>
                </mat-card-content>
            </mat-card>
        </div>
        <div id="workspace">
            <router-outlet></router-outlet>
        </div>
    </div>
</ng-container>

<!-- Microfrontend: layout y menú provistos por el core -->
<div class="main-container" *ngIf="isMicrofrontend">
    <router-outlet></router-outlet>
</div>
